name: Monitor Japanese gacha sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gacha-source-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check announcement sources
        run: python scripts/monitor_sources.py
      - name: Upload source monitor report
        uses: actions/upload-artifact@v4
        with:
          name: gacha-source-monitor-report
          path: source-monitor-report.json
          if-no-files-found: error
          retention-days: 30
