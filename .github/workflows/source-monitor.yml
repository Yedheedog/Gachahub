name: Monitor Japanese gacha sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gacha-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check announcement sources
        run: python scripts/monitor_sources.py
      - name: Publish report for the Android app
        run: |
          cp source-monitor-report.json data/source-monitor-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-monitor-report.json
          if git diff --cached --quiet; then
            echo "Published report is unchanged; no commit needed."
          else
            git commit -m "Update source monitor report"
            git push
          fi
      - name: Upload source monitor report artifact
        uses: actions/upload-artifact@v4
        with:
          name: gacha-source-monitor-report
          path: source-monitor-report.json
          if-no-files-found: error
          retention-days: 30
